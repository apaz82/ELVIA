<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ELVIA">
  <defs>
    <!-- Gradiente swoosh: fade-in, pico brillante bajo A, fade-out -->
    <linearGradient id="swooshGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00B8CC" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#00C8DC" stop-opacity="0.6"/>
      <stop offset="62%"  stop-color="#00D8F0" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#00C0D4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00B8CC" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow del swoosh (más sutil en versión light) -->
    <filter id="swooshGlowL" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Halo muy sutil bajo la A -->
    <radialGradient id="haloGradL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00D4E8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sin fondo (transparente) — listo para usarse sobre cualquier color -->

  <!-- Halo bajo la A -->
  <ellipse cx="600" cy="158" rx="130" ry="40"
           fill="url(#haloGradL)" filter="url(#swooshGlowL)"/>

  <!-- Texto ELVIA negro -->
  <text x="400" y="152"
        font-family="'Orbitron', 'Exo 2', 'Arial Black', sans-serif"
        font-weight="700"
        font-size="112"
        letter-spacing="6"
        fill="#111111"
        text-anchor="middle">ELVIA</text>

  <!-- Swoosh cian -->
  <path d="
    M 235,164
    C 340,150 480,144 595,157
    C 640,162 690,159 740,154
    L 740,161
    C 690,167 640,170 595,165
    C 480,154 340,162 235,173
    Z"
    fill="url(#swooshGradL)"
    filter="url(#swooshGlowL)"/>
</svg>
