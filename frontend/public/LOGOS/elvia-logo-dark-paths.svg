<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ELVIA">
  <defs>
    <radialGradient id="bgGrad" cx="68%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#0E2440"/>
      <stop offset="100%" stop-color="#060D18"/>
    </radialGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4E8" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#00D4E8" stop-opacity="0.55"/>
      <stop offset="62%"  stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#00D4E8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00D4E8" stop-opacity="0"/>
    </linearGradient>

    <filter id="swooshGlow" x="-10%" y="-200%" width="120%" height="500%">
